# BolsaTrader - orquestração dos containers (aplicação Django + PostgreSQL)
#
# Uso:
#   1) copie .env.example para .env e ajuste os valores;
#   2) docker compose up --build
#   3) acesse http://localhost:8000
#
# As variáveis abaixo (${DB_NAME}, ${DB_USER}, ...) são lidas automaticamente
# do arquivo ".env" na mesma pasta deste arquivo.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bolsatrader}
      POSTGRES_USER: ${DB_USER:-bolsatrader_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bolsatrader_user} -d ${DB_NAME:-bolsatrader}"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do Docker Compose, o banco de dados é acessado pelo
      # nome do serviço ("db"), não por localhost/127.0.0.1.
      DB_HOST: db
      DB_PORT: 5432
      # O gunicorn sobe 3 workers - com o agendador embutido ligado, cada um
      # buscaria as cotações (3x o consumo da brapi e alertas duplicados). A
      # atualização automática fica no serviço "cotacoes" abaixo, um só processo.
      AGENDADOR_COTACOES_EMBUTIDO: "False"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - staticfiles_data:/app/staticfiles

  # Atualização automática de cotações/alertas/robô a cada
  # COTACOES_INTERVALO_MINUTOS - processo único, separado dos workers web.
  cotacoes:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "atualizar_cotacoes", "--loop"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      AGENDADOR_COTACOES_EMBUTIDO: "False"
    depends_on:
      web:
        condition: service_started

  # Busca as manchetes das fontes de notícias a cada NOTICIAS_INTERVALO_MINUTOS.
  noticias:
    build: .
    restart: unless-stopped
    command: ["python", "manage.py", "atualizar_noticias", "--loop"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      AGENDADOR_COTACOES_EMBUTIDO: "False"
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  staticfiles_data:
